colorScheme = "blowfish"
defaultAppearance = "light"
autoSwitchAppearance = true
enableSearch = true
enableCodeCopy = true
enableStructuredBreadcrumbs = true
mainSections = ["papers"]
disableImageOptimization = false
defaultBackgroundImage = "img/bg.jpg"
defaultSocialImage = "img/social-card-light.png"
highlightCurrentMenuArea = true
smartTOC = true
fingerprintAlgorithm = "sha512"

[header]
  layout = "fixed-fill-blur"

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = false
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "custom"
  showRecent = false

[article]
  showDate = true
  showDateUpdated = true
  showAuthor = false
  showHero = false
  showBreadcrumbs = true
  showDraftLabel = true
  showEdit = false
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = true
  showTableOfContents = true
  showRelatedContent = true
  relatedContentLimit = 4
  showTaxonomies = true
  showWordCount = true
  sharingLinks = ["email", "linkedin", "twitter"]
  showZenMode = true

[list]
  showHero = false
  showBreadcrumbs = true
  showSummary = true
  showCards = true
  groupByYear = false
  cardView = true
  constrainItemsWidth = false

[taxonomy]
  showTermCount = true
  showHero = false
  showBreadcrumbs = true
  cardView = true

[term]
  showHero = false
  showBreadcrumbs = true
  groupByYear = false
  cardView = true

