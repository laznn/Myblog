<svg class="liquid-filter-defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <filter id="liquid-warp" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.014" numOctaves="2" seed="8" result="noise" />
      <feGaussianBlur in="noise" stdDeviation="1.2" result="softNoise" />
      <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="14" xChannelSelector="R" yChannelSelector="B" />
    </filter>
  </defs>
</svg>
{{ $liquid := resources.Get "js/liquid-glass.js" | minify | fingerprint "sha512" }}
<script src="{{ $liquid.RelPermalink }}" integrity="{{ $liquid.Data.Integrity }}" defer></script>
<script>
  window.addEventListener("load", () => {
    if (typeof renderMathInElement !== "function") return;
    renderMathInElement(document.body, {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "\\[", right: "\\]", display: true },
        { left: "\\(", right: "\\)", display: false },
        { left: "$", right: "$", display: false }
      ],
      throwOnError: false,
      strict: "ignore"
    });
  });
</script>
